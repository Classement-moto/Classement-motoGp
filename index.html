<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15151e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motos 2026">
<title>Classement pilotes Motos 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#111116;--card:#1b1b23;--tx:#f2f2f5;--mut:#9a9aa8;--line:#2a2a35;--acc:#e10600}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.next{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.next b{color:var(--acc)}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:12px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pos{font-weight:700;font-size:16px;text-align:center}
.name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.team{color:var(--mut);font-size:12px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.pts{text-align:right;font-weight:700;font-size:18px}
.gap{color:var(--mut);font-size:11px;font-weight:400;display:block}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 13px/1.2 system-ui,sans-serif;padding:8px 4px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.race{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rd{color:var(--mut);font-weight:700;font-size:13px;text-align:center}
.gp{font-weight:600;font-size:15px}
.dt{color:var(--mut);font-size:12px}
.win{text-align:right;font-size:14px;font-weight:600}
.win small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.next{cursor:pointer}
.next.open .chev{transform:rotate(180deg)}
#cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:-4px 0 12px}
.crow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow b{font-weight:600}
.crow small{display:block;color:var(--mut);font-size:11px}
.crow .d{color:var(--mut);font-size:12px;text-align:right}
.crow.done .d::after{content:" ✓"}
.crow.nx{color:var(--acc)}
.crow.nx .d{color:var(--acc);font-weight:700}
.race{cursor:pointer}
.chev{color:var(--mut);font-size:11px;margin-left:4px;display:inline-block;transition:transform .2s}
.race.open .chev{transform:rotate(180deg)}
.det{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.race.open .det{display:block}
.rr{display:grid;grid-template-columns:26px 12px 1fr auto;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.rp{color:var(--mut);font-weight:700;text-align:right}
.rt{color:var(--mut);font-size:12px}
.nodet,.note{color:var(--mut);font-size:12px}
.foot{color:var(--mut);font-size:12px;margin:14px 0 6px;text-align:center}
.drv{cursor:pointer}
.dh{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;cursor:default}
.drv.open .dh{display:block}
.drv.open .chev{transform:rotate(180deg)}
.drv.open{--mut:#e0e0ea;background:linear-gradient(180deg,#000 0%,#06060a 22%,color-mix(in srgb,var(--tc) 82%,#000) 100%);border-color:color-mix(in srgb,var(--tc) 55%,var(--line))}
.drv.open .dh,.drv.open .team,.drv.open .dn,.drv.open .ds{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.drv.open .dh .mut,.drv.open .dh p,.drv.open .dh small{color:#f2f2f5}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:64px;height:64px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.dn{font-weight:700;font-size:16px}
.ds{color:var(--mut);font-size:12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.st div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mut)}
.st b{display:block;font-size:18px;color:var(--tx)}
.chs{display:flex;flex-wrap:wrap;gap:5px}
.ch{min-width:44px;text-align:center;background:var(--bg);border-radius:8px;padding:4px 5px;font-size:13px;font-weight:700}
.ch i{display:block;font-style:normal;font-size:9px;color:var(--mut);font-weight:600}
.ch.w{background:#f2c200;color:#15151e}.ch.w i{color:#15151e}
.ch.p{background:#aeb4c0;color:#15151e}.ch.p i{color:#15151e}
.ch.x{background:#c0261b;color:#fff}.ch.x i{color:#fff}
.ch.n{opacity:.4}
.lg{color:var(--mut);font-size:11px;margin-top:8px}
.tg{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;letter-spacing:.4px;line-height:1.5;flex:none;display:inline-block}
.dn .tg,.rr .tg{margin-left:6px}
.pn{--tc:#888}
.dhead{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 30%,transparent),transparent 80%);border-radius:16px;padding:12px}
.av{box-shadow:0 0 0 3px var(--tc)}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.hero div{background:var(--bg);border-radius:14px;padding:10px 4px 9px;text-align:center;font-size:11px;color:var(--mut);border-top:3px solid var(--tc)}
.hero b{display:block;font-size:30px;line-height:1.1;color:var(--tx);font-weight:800;letter-spacing:-.5px}
.hero em{font-style:normal;display:block;font-size:15px;margin-bottom:1px}
.st div{border-radius:12px}
.st b{font-size:17px}
.ch{border-radius:10px}
.ch.w{background:linear-gradient(135deg,#ffd84d,#f2a900)}
.ch.p{background:linear-gradient(135deg,#dde1e8,#9ca3b2)}
.bars{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:2px 0 4px}
.bc{display:flex;flex-direction:column;align-items:center;min-width:18px}
.bb{width:100%;border-radius:5px 5px 0 0;background:var(--tc);opacity:.85}
.bb.tt{background:linear-gradient(180deg,#ffd84d,#f2a900);opacity:1}
.bv{font-size:9px;color:var(--mut);height:12px;line-height:12px;font-weight:700}
.by{font-size:9px;color:var(--mut);margin-top:2px}
.pn{position:relative;overflow:hidden;border-radius:16px}
.pn>*:not(.wm){position:relative;z-index:1}
.wm{position:absolute;right:8px;top:18px;font-weight:900;font-style:italic;letter-spacing:-2px;color:var(--tc);opacity:.17;pointer-events:none;white-space:nowrap;z-index:0}
.pn>.wi{position:absolute;z-index:0;left:0;right:0;top:0;height:210px;background-size:cover;background-position:center;opacity:.28;-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent);mask-image:linear-gradient(180deg,#000 40%,transparent)}
.cr{font-size:12px;color:var(--mut)}
.crow{cursor:pointer}
.cc{grid-column:1/-1;display:none;text-align:center;padding:4px 0 6px}
.crow.open .cc{display:block}
.cc img{max-width:100%;max-height:260px;border-radius:10px;background:#fff;padding:8px}

.ig-title{font-size:27px;font-weight:900;letter-spacing:-.5px;line-height:1.08}
.ig-title .tg{margin-left:9px;vertical-align:middle;font-size:11px}
.ig-sub{font-size:12.5px;color:var(--mut);margin:5px 0 12px}
.ig-top{display:grid;grid-template-columns:41% 1fr;gap:12px;align-items:stretch;margin-bottom:6px}
.av.ig-ph{width:auto;height:auto;min-height:200px;border-radius:14px;font-size:46px;box-shadow:none;border:2px solid rgba(255,255,255,.25)}
.av.ig-ph img{object-position:center top}
.ig-li{display:flex;flex-direction:column;justify-content:center;gap:9px;font-size:14px}
.ig-li div::before{content:"";display:inline-block;width:8px;height:8px;background:#fff;margin-right:8px;vertical-align:middle}
.ig-li b{font-weight:800}
.ig-h{display:inline-block;background:#000;color:#fff;font-weight:800;font-size:15px;padding:5px 16px 5px 11px;border-radius:0 9px 9px 0;border-left:5px solid #f2c200;margin:14px 0 8px}
.ig-tr{font-size:21px;letter-spacing:1px;line-height:1.35;margin-bottom:4px}
.ig-tr small{font-size:13px;font-weight:700;color:#fff;letter-spacing:0}
.ig-p{font-size:14px;margin:2px 0}
.ig-p::before{content:"";display:inline-block;width:8px;height:8px;background:#fff;margin-right:8px;vertical-align:middle}
.ig-rb{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.ig-rb>div{font-size:13px}
.ig-rb>div.f{grid-column:1/-1}
.ig-b{height:22px;margin-top:3px;display:flex}
.ig-b i{font-style:normal;font-weight:800;font-size:14px;color:#15151e;background:linear-gradient(180deg,#ffd84d,#f2a900);padding:0 8px;display:flex;align-items:center;min-width:30px;border-radius:2px}
.av.ig-ph.wi{background-size:cover;background-position:center}
.wi[style*="background-image"] .ig-in{display:none}
.ig-tm{display:flex;flex-direction:column;gap:3px;margin-bottom:2px}
</style>
</head>
<body>
<h1>🏍️ Classement pilotes <span>Motos 2026</span></h1>
<p class="sub" id="sub"></p>
<div class="next" id="nextbox"><span>Prochain GP : <b id="nx"></b> <span class="chev">▼</span></span><span id="nd"></span></div>
<div id="cal" hidden></div>
<div class="tabs"><button id="t1" class="on">Classement pilotes</button><button id="t2">Courses</button><button id="t3">Classement équipes</button></div>
<div id="v1"><input id="q" type="search" placeholder="Rechercher un pilote ou une écurie…">
<div id="list"></div></div>
<div id="v2" hidden><div id="races"></div></div>
<div id="v3" hidden><div id="cons"></div></div>
<p class="foot">Mis à jour après chaque Grand Prix.</p>
<script>
const OPEN=new Set();
const CIRC={"Thaïlande": ["Chang International Circuit", "chang"], "Brésil": ["Autódromo Internacional Ayrton Senna Goiânia", "goi"], "États-Unis": ["Circuit of the Americas", "americas"], "Espagne": ["Circuito de Jerez", "jerez"], "France": ["Bugatti Circuit", "bugatti"], "Catalogne": ["Circuit de Barcelona-Catalunya", "catalunya"], "Italie": ["Mugello Circuit", "mugello"], "Hongrie": ["Balaton Park Circuit", "balaton"], "Tchéquie": ["Brno Circuit", "brno"], "Pays-Bas": ["TT Circuit Assen", "assen"], "Allemagne": ["Sachsenring", "sachsenring"], "Grande-Bretagne": ["Silverstone Circuit", "silverstone"], "Aragon": ["MotorLand Aragón", "motorland"], "Saint-Marin": ["Misano World Circuit Marco Simoncelli", "misano"], "Autriche": ["Red Bull Ring", "redbullring"], "Japon": ["Mobility Resort Motegi", "motegi"], "Indonésie": ["Mandalika International Street Circuit", "mandalika"], "Australie": ["Phillip Island Grand Prix Circuit", "phillipisland"], "Malaisie": ["Sepang International Circuit", "sepang"], "Qatar": ["Lusail International Circuit", "lusail"], "Portugal": ["Algarve International Circuit", "algarve"], "Valence": ["Circuit Ricardo Tormo", "tormo"]};
const CIM={};
function ckey(g){return CIRC[g]?g:String(g).replace(/ \(.*\)$/,"")}
function ccHTML(g){const k=ckey(g);if(!CIRC[k])return '<div class="lg">Tracé indisponible pour ce circuit.</div>';if(CIM[k])return `<img alt="Tracé du circuit" src="${CIM[k]}"><div class="lg">Tracé : Wikipédia</div>`;if(CIM[k]===null&&CDONE[k])return '<div class="lg">Tracé indisponible pour ce circuit.</div>';return '<div class="lg">Chargement du tracé…</div>'}
const CDONE={};
function ccApply(g){document.querySelectorAll("#cal .crow").forEach(e=>{if(e.dataset.g===g&&e.classList.contains("open"))e.querySelector(".cc").innerHTML=ccHTML(g)})}
async function circ(g){
  const k=ckey(g),q=CIRC[k];if(!q)return;
  if(k in CIM){ccApply(g);return}
  CIM[k]=null;
  try{const o=JSON.parse(localStorage.getItem("circ:"+k)||"null");if(o&&Date.now()-o.t<6048e5){CIM[k]=o.u;CDONE[k]=1;ccApply(g);return}}catch(e){}
  try{
    const r=await fetch("https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q[0])+"&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=800&format=json&origin=*");
    const j=await r.json(),nz=x=>x.toLowerCase().replace(/[^a-z0-9]/g,"");
    const pg=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
    const hit=pg.find(p=>p.thumbnail&&nz(p.title).includes(q[1]));
    if(hit){CIM[k]=hit.thumbnail.source;try{localStorage.setItem("circ:"+k,JSON.stringify({t:Date.now(),u:CIM[k]}))}catch(e){}}
  }catch(e){}
  CDONE[k]=1;ccApply(g);
}
const CARS={"Mercedes":"W17","Ferrari":"SF-26","McLaren":"MCL40","Red Bull":"RB22","Racing Bulls":"VCARB 03","Alpine":"A526","Haas":"VF-26","Audi":"R26","Aston Martin":"AMR26","Williams":"FW48","Cadillac":"MAC-26","Aprilia Racing":"RS-GP26","Trackhouse":"RS-GP26","Ducati Lenovo Team":"Desmosedici GP26","Gresini":"Desmosedici GP26","VR46":"Desmosedici GP26","Pramac Yamaha":"YZR-M1","Yamaha":"YZR-M1","Red Bull KTM Factory":"RC16","KTM Tech3":"RC16","Honda HRC":"RC213V","LCR Honda":"RC213V"};
const CARO={"Fermín Aldeguer":"Desmosedici GP25"};
function carOf(n,t){return CARO[n]||CARS[t]||""}
const CQ={"Mercedes":["Mercedes W17","mercedes","w17"],"Ferrari":["Ferrari SF-26","ferrari","sf26"],"McLaren":["McLaren MCL40","mclaren","mcl40"],"Red Bull":["Red Bull RB22","redbull","rb22"],"Racing Bulls":["Racing Bulls VCARB 03","racingbulls","vcarb03"],"Alpine":["Alpine A526","alpine","a526"],"Haas":["Haas VF-26","haas","vf26"],"Audi":["Audi R26","audi","r26"],"Aston Martin":["Aston Martin AMR26","astonmartin","amr26"],"Williams":["Williams FW48","williams","fw48"],"Cadillac":["Cadillac MAC-26","cadillac","mac26"],"Aprilia Racing":["Aprilia RS-GP","aprilia","rsgp"],"Trackhouse":["Aprilia RS-GP","aprilia","rsgp"],"Ducati Lenovo Team":["Ducati Desmosedici","ducati","desmosedici"],"Gresini":["Ducati Desmosedici","ducati","desmosedici"],"VR46":["Ducati Desmosedici","ducati","desmosedici"],"Pramac Yamaha":["Yamaha YZR-M1","yamaha","yzrm1"],"Yamaha":["Yamaha YZR-M1","yamaha","yzrm1"],"Red Bull KTM Factory":["KTM RC16","ktm","rc16"],"KTM Tech3":["KTM RC16","ktm","rc16"],"Honda HRC":["Honda RC213V","honda","rc213v"],"LCR Honda":["Honda RC213V","honda","rc213v"]};
const CPH={};
function wi(t){return CQ[t]?`<div class="wi" data-t="${t}"${CPH[t]?` style="background-image:url('${CPH[t]}')"`:""}></div>`:""}
function wiApply(t){document.querySelectorAll(".wi").forEach(e=>{if(e.dataset.t===t&&CPH[t])e.style.backgroundImage=`url("${CPH[t]}")`})}
async function carPhoto(t){
  const q=CQ[t];if(!q)return;
  if(t in CPH){wiApply(t);return}
  CPH[t]=null;
  try{const o=JSON.parse(localStorage.getItem("cph:"+t)||"null");if(o&&Date.now()-o.t<2592e5){CPH[t]=o.u;wiApply(t);return}}catch(e){}
  try{
    const r=await fetch("https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q[0])+"&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=700&format=json&origin=*");
    const j=await r.json(),nz=x=>x.toLowerCase().replace(/[^a-z0-9]/g,"");
    const pg=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
    const hit=pg.find(p=>p.thumbnail&&nz(p.title).includes(q[1])&&nz(p.title).includes(q[2]));
    if(hit){CPH[t]=hit.thumbnail.source;try{localStorage.setItem("cph:"+t,JSON.stringify({t:Date.now(),u:CPH[t]}))}catch(e){}}
  }catch(e){}
  wiApply(t);
}
function wm(n,t){const c=carOf(n,t);return c?`<div class="wm" style="font-size:${c.length>9?34:54}px">${c}</div>`:""}
function ico(l){return l.startsWith("Victoires")?"🏆":l.startsWith("Podiums")?"🏅":l.startsWith("Points")?"⚡":l.startsWith("Titres")?"👑":l.startsWith("Pole")?"⏱️":""}
function stHTML(st,h){return `<div class="hero">${h.map(i=>`<div>${ico(st[i][1])?`<em>${ico(st[i][1])}</em>`:""}<b>${st[i][0]}</b>${st[i][1]}</div>`).join("")}</div><div class="st">${st.filter((_,i)=>!h.includes(i)).map(a=>`<div><b>${a[0]}</b>${a[1]}</div>`).join("")}</div>`}
const ABBR={"Mercedes":"MER","Ferrari":"FER","McLaren":"MCL","Red Bull":"RBR","Racing Bulls":"RB","Alpine":"ALP","Haas":"HAA","Audi":"AUD","Aston Martin":"AMR","Williams":"WIL","Cadillac":"CAD","Aprilia Racing":"APR","Trackhouse":"TRK","Ducati Lenovo Team":"DUC","VR46":"VR4","Gresini":"GRE","Red Bull KTM Factory":"KTM","KTM Tech3":"TE3","Honda HRC":"HRC","LCR Honda":"LCR","Yamaha":"YAM","Pramac Yamaha":"PRA"};
function tg(t){if(!t)return"";const c=COL[t]||"#888",m=/^#/.test(c)?c.match(/\w\w/g).map(h=>parseInt(h,16)):[136,136,136],l=.299*m[0]+.587*m[1]+.114*m[2];return `<span class="tg" style="background:${c};color:${l>150?"#15151e":"#fff"}">${ABBR[t]||t.slice(0,3).toUpperCase()}</span>`}
const DATA={
  round:17, total:22, after:"Grand Prix d'Indonésie (Mandalika)", date:"11 octobre 2026",
  next:"Australie (Phillip Island)", nextDate:"25 octobre 2026",
  drivers:[
    ["Jorge Martín","Aprilia Racing",355],["Marc Márquez","Ducati Lenovo Team",353],
    ["Marco Bezzecchi","Aprilia Racing",309],["Ai Ogura","Trackhouse",259],
    ["Pedro Acosta","Red Bull KTM Factory",258],["Fabio Di Giannantonio","VR46",245],
    ["Raúl Fernández","Trackhouse",236],["Álex Márquez","Gresini",172],
    ["Francesco Bagnaia","Ducati Lenovo Team",166],["Fermín Aldeguer","Gresini",125],
    ["Enea Bastianini","KTM Tech3",122],["Luca Marini","Honda HRC",108],
    ["Brad Binder","Red Bull KTM Factory",104],["Fabio Quartararo","Yamaha",74],
    ["Diogo Moreira","LCR Honda",74],["Franco Morbidelli","VR46",59],
    ["Johann Zarco","LCR Honda",51],["Joan Mir","Honda HRC",33],
    ["Jack Miller","Pramac Yamaha",28],["Álex Rins","Yamaha",25],
    ["Toprak Razgatlıoğlu","Pramac Yamaha",18],["Maverick Viñales","KTM Tech3",12],
    ["Iker Lecuona","Gresini",9],["Augusto Fernández","Yamaha",6],
    ["Pol Espargaró","KTM Tech3",5],["Somkiat Chantra","Honda HRC",3],
    ["Takaaki Nakagami","Honda HRC",3]
  ]
};
const C={A:"#a43fd4",D:"#d11a2a",K:"#ff6a13",H:"#f2c200",Y:"#1e5cff"};
const COL={"Aprilia Racing":C.A,"Trackhouse":C.A,"Ducati Lenovo Team":C.D,"VR46":C.D,"Gresini":C.D,"Red Bull KTM Factory":C.K,"KTM Tech3":C.K,"Honda HRC":C.H,"LCR Honda":C.H,"Yamaha":C.Y,"Pramac Yamaha":C.Y};
document.getElementById("sub").textContent="Après la manche "+DATA.round+"/"+DATA.total+" · "+DATA.after+" · "+DATA.date;
document.getElementById("nx").textContent=DATA.next;
document.getElementById("nd").textContent=DATA.nextDate;
const max=DATA.drivers[0][2];
function render(f){
  const t=(f||"").toLowerCase();
  document.getElementById("list").innerHTML=DATA.drivers.map((d,i)=>{

async function photo(name){
  if(name in PH)return;PH[name]=null;
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent((WT[name]||name).replace(/ /g,"_")));
    if(!r.ok)return;const j=await r.json();
    if(j.type!=="standard"||!j.thumbnail||!/racing|driver|rider|motorcycl|motorsport|formula/i.test((j.description||"")+" "+(j.extract||"").slice(0,250)))return;
    PH[name]=j.thumbnail.source;
    document.querySelectorAll(".av").forEach(a=>{if(a.dataset.n===name)a.innerHTML=avHTML(name)});
  }catch(e){}
}

function thist(team){
  const col=COL[team]||"#888",codes=Object.keys(N).filter(k=>TEAM[N[k]]===team);
  const T={};DATA.drivers.forEach(d=>T[d[1]]=(T[d[1]]||0)+d[2]);
  const TL=Object.entries(T).sort((a,b)=>b[1]-a[1]),rk=TL.findIndex(x=>x[0]===team)+1,pts=T[team]||0;
  let w=0,pod=0,t5=0,dnf=0,ent=0,best=0;const chips=[],per={};

  RES.forEach((s,i)=>{
    const g=(RACES[i]&&RACES[i][0])||"";let b=0,any=false;

      codes.forEach(c=>{const k=p[0].indexOf(c);
        if(k>=0){const r=k+1;any=true;ent++;per[c].ent++;if(!b||r<b)b=r;if(r<=3){pod++;per[c].pod++}if(r<=5)t5++;if(r===1)per[c].w++}
        else if((p[1]||[]).includes(c)){any=true;ent++;dnf++;per[c].ent++;per[c].dnf++}})}
    let cls="n",v="–";
    if(b){v=b;cls=b===1?"w":b<=3?"p":"";if(b===1)w++;if(!best||b<best)best=b}
    else if(any){v="✕";cls="x"}
    chips.push(`<span class="ch ${cls}" title="GP ${g}"><i>${g.slice(0,3).toUpperCase()}</i>${v}</span>`)});
  const st=[[rk+"e","Classement"],[pts,"Points"],[w,"Victoires"],[pod,"Podiums (pilotes)"],[t5,"Top 5 (pilotes)"],[dnf,"Abandons / NC"],[ent,"Départs (pilotes)"],[best?best+"e":"–","Meilleur résultat"],[DATA.drivers.filter(d=>d[1]===team).length,"Pilotes"]];
  const dr=DATA.drivers.filter(d=>d[1]===team).map(d=>{const c=Object.keys(N).find(k=>N[k]===d[0]),q=per[c]||{w:0,pod:0,dnf:0,ent:0};

  const ord=n=>n===1?"1er":n+"e";

  const tro=w?"🏆".repeat(Math.min(w,10))+(w>10?` <small>+${w-10}</small>`:""):"";
  const rb=(l,v)=>`<div>${l}<div class="ig-b"><i style="width:${sc(v)}%">${v}</i></div></div>`;
  const nd=DATA.drivers.filter(d=>d[1]===team).length;
  return `<div class="pn" style="--tc:${col}">${wm("",team)}${wi(team)}<div class="ig-title">${team}</div><div class="ig-sub">${carOf("",team)?carOf("",team)+" · ":""}Saison 2026</div><div class="ig-top"><div class="av ig-ph${CQ[team]?" wi":""}" data-t="${team}" style="background-color:${col}${CPH[team]?`;background-image:url('${CPH[team]}')`:""}"><span class="ig-in">${ini(team)}</span></div><div class="ig-li"><div>Classement : <b>${ord(rk)}</b></div><div>Points : <b>${pts}</b></div><div>Pilotes : <b>${nd}</b></div><div>Départs (pilotes) : <b>${ent}</b></div><div>Meilleur résultat : <b>${best?ord(best):"–"}</b></div></div></div><div class="ig-h">Palmarès 2026</div>${tro?`<div class="ig-tr">${tro}</div>`:""}<div class="ig-p"><b>${w}</b> victoire${w>1?"s":""} · <b>${pod}</b> podium${pod>1?"s":""} (pilotes)</div><div class="ig-h">Records de la saison</div><div class="ig-rb">${rb("Victoires",w)}${rb("Podiums",pod)}${rb("Top 5",t5)}${rb("Abandons / NC",dnf)}</div><div class="ig-h">Pilotes</div>${dr}<div class="ig-h">Meilleur résultat par GP</div><div class="chs">${chips.join("")}</div><div class="lg">Or : victoire · gris : podium · ✕ : abandon ou non classé · – : absent. Barres : sur ${ent} départ${ent>1?"s":""} de pilotes. Les pilotes sont rattachés à leur équipe actuelle ; « Victoires » compte les courses gagnées par l'équipe. Photo : Wikipédia, si disponible.</div></div>`;
